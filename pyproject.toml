[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexaudit"
version = "0.1.0"
description = "LexAudit — AI legal auditor for Kazakhstan contracts"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.35",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
lexaudit = "lexaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lexaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
